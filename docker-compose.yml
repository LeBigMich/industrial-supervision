version: '3.8'

services:
  # ============ BASE DE DONNÉES ============
  database:
    image: mariadb:latest
    container_name: industrial_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: industrial_monitoring
      MYSQL_USER: industrial_user
      MYSQL_PASSWORD: industrial_pass
    ports:
      - "3307:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    networks:
      - industrial_network
    restart: unless-stopped


  # ============ BACKEND API ============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: industrial_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=industrial_db
      - DB_PORT=3306
      - DB_USER=industrial_user
      - DB_PASSWORD=industrial_pass
      - DB_NAME=industrial_monitoring
      - NODE_ENV=production
    depends_on:
      - database
    networks:
      - industrial_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============ FRONTEND ============
  frontend:
    image: nginx:alpine
    container_name: industrial_frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - industrial_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============ VOLUMES ============
volumes:
  db_data:
    driver: local

# ============ RÉSEAUX ============
networks:
  industrial_network:
    driver: bridge
